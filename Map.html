<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Map | Christchurch Fruit Trail</title>
        <link rel="stylesheet" href="MapPage.css">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
        <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">
        <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">
        <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    </head>

    <body>
        <header>
            <div class="wrapper">
                <div class="logo"><img src="Images/Logo2.png" alt="Christchurch Fruit Trail Logo"></div>
                <ul class="nav-area">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#">Map</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="tutorial.html">Tutorial</a></li>
                </ul>
            </div>
        </header>

        <main>
            <div id="map"></div>
        </main>

        <footer>
        <P>&copy; Nick Stone, 2026</P>
    </footer>

    </body>
    <script>
        var map = L.map('map').setView([-43.5321, 172.6362], 13);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        var markers = L.markerClusterGroup();

        fetch("data/trees.geojson")
            .then(response => response.json())
            .then(data => {
                var geoLayer = L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 10,
                            fillColor: feature.properties.color,
                            color: "#000",
                            weight: 2,
                            fillOpacity: 0.9
                        });
                    },
                    onEachFeature: function (feature, layer) {
                        if (feature.properties) {
                            layer.bindPopup(`
                                <div class="TreePopUp">
                                    <h3>${feature.properties.Name}</h3>
                                    <p><strong>Type:</strong> ${feature.properties.group}</p>
                                    <p><strong>Botanical:</strong> ${feature.properties.Botanical}</p>
                            `);
                        }
                    }
                })
                markers.addLayer(geoLayer);
                map.addLayer(markers);
                
            });


    </script>
</html>
